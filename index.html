<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="icons/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="icons/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="icons/favicon-16x16.png"
    />
    <link rel="manifest" href="manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Updates to match the chrome around the page: dark hex mirrors
         --background in index.css exactly, light hex matches theme_color in
         manifest.json. Chrome paints the PWA's status bar from this meta; the
         scripts below keep it dynamic across themes and OS scheme changes. -->
    <meta name="theme-color" id="theme-color-meta" content="#F5F3ED" />
    <title>Spend Wisely</title>
    <script>
      // Set the theme class before first paint so a dark OS doesn't flash cream.
      (function () {
        var preference = "system";
        try {
          preference =
            JSON.parse(localStorage.getItem("user-settings") || "{}").state
              .theme || "system";
        } catch (error) {
          preference = "system";
        }
        var prefersDark =
          window.matchMedia &&
          window.matchMedia("(prefers-color-scheme: dark)").matches;
        var isDark = preference === "dark" || (preference !== "light" && prefersDark);
        document.documentElement.classList.toggle("dark", isDark);
        var metaThemeColor = document.querySelector('meta[name="theme-color"]');
        if (metaThemeColor) {
          metaThemeColor.setAttribute("content", isDark ? "#191b18" : "#F5F3ED");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
